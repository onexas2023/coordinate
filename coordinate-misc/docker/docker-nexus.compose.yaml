# docker compose -f docker-nexus.compose.yaml up -d
name: nexus
services:
  nexus:
    image: sonatype/nexus3:3.95.1
    container_name: nexus
    restart: unless-stopped
    ports:
      - 8081:8081
      - 8082:8082
    volumes:
      - /data/nexus-data:/nexus-data # sudo chown -R 200:200 /data/nexus-data
    networks:
      - nexus
networks:
  nexus:
    name: nexus_network
    driver: bridge