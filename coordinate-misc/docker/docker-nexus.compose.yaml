# docker compose -f docker-nexus.compose.yaml up -d
name: nexus
services:
  nexus:
    image: sonatype/nexus3:3.95.1
    container_name: nexus
    restart: unless-stopped
    ports:
      - 8081:8081
    volumes:
      - nexus_data:/nexus-data
    networks:
      - nexus
networks:
  nexus:
    name: nexus_network
    driver: bridge
# Define named volumes for reliable persistence across reboots
volumes:
  nexus_data:
    name: nexus-data	